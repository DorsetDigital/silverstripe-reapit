name: CI
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: composer validate --strict
